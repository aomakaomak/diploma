{% extends 'services/base.html' %}

{% block title %}Добавить услугу{% endblock %}

{% block content %}

<h2>Форма для услуги</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'services:home' %}" class="btn btn-primary">Отменить</a>
</form>

{% endblock %}
